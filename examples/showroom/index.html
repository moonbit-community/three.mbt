<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showroom</title>
<link rel="stylesheet" href="../shell.css">
</head>
<body>
<canvas></canvas>
<div class="card">
	<h1>Showroom</h1>
	<p>A battle-worn sci-fi helmet under a Venetian sunset. The metal reflects the real sky, the
	scratches catch the light, and the visor glows.</p>
</div>
<div class="panel">
	<label>Glow <input id="bloom" type="range" min="0" max="2" step="0.05" value="0.45"></label>
	<label>Turn slowly <input id="spin" type="checkbox" checked></label>
</div>
<div class="hint">Drag to turn it &middot; scroll or pinch to zoom</div>
<a class="back" href="../">&larr; All demos</a>
<div class="made">Made with <a href="https://github.com/moonbit-community/three.mbt">three.js in MoonBit</a></div>
<div class="loading"><div class="box"><div class="spinner"></div><h2>Polishing the helmet&hellip;</h2><p>Loading the model and the sky.</p></div></div>
<script type="module">
import { boot, run } from '../shell.js';

const demo = await boot( 'showroom' );
if ( demo ) {

	run( demo );
	document.getElementById( 'bloom' ).addEventListener( 'input', ( e ) => demo.set_bloom( Number( e.target.value ) ) );
	document.getElementById( 'spin' ).addEventListener( 'change', ( e ) => demo.set_auto_rotate( e.target.checked ) );

}
</script>
</body>
</html>
